semantic_perception:
  ros__parameters:
    topics:
      color: /sim/rail_franka1/cam/wrist/color/image_raw
      aligned_depth: /sim/rail_franka1/cam/wrist/depth/image_raw
    camera:
      fx: 907.00
      fy: 905.69
      cx: 567.74
      cy: 488.32
      image_width: 1280
      image_height: 720
      # Image headers use sim_camera, while the robot TF tree uses wrist_camera.
      tf_frame_override: wrist_camera
    reference_frame: global_origin
    processing_rate_hz: 12.0
    sync:
      queue_size: 20
      # Accept RGB/depth pairs only when their header stamps differ by <=30 ms.
      slop_sec: 0.03
      # Reject a matched pair if RGB/depth still differ by more than 15 ms.
      max_rgb_depth_delta_sec: 0.015
    tf_timeout_sec: 0.2
    tf:
      # Buffer synchronized RGB-D packets briefly so lower-rate TF publication
      # can catch up and interpolate at the image timestamp.
      sync_queue_size: 60
      max_wait_sec: 0.5
      # Require TF data 30 ms after each camera frame before localizing it.
      post_image_guard_sec: 0.03
      # Latest TF can geometrically smear detections while the camera moves.
      fallback_to_latest: false
    detector:
      backend: ultralytics
      model_path: ""
      device: cuda:0
      image_size: 640
      confidence_threshold: 0.50
      max_detections: 100
      max_bbox_area_fraction: 0.55
      border_margin_fraction: 0.03
    appearance:
      enabled: true
      backend: mobileclip_s0
      # Local pretrained checkpoint; runtime never downloads model weights.
      mobileclip_checkpoint: ""
      image_size: 224
      max_cosine_distance: 0.35
      cost_weight: 0.5
      embedding_decay: 0.90
    semantic_text:
      enabled: true
      minimum_cosine_similarity: 0.25
      max_results: 5
    distance_weighting:
      reference_distance_m: 1.0
      minimum_class_evidence_weight: 0.25
    depth:
      scale_16uc1: 0.001
      inner_bbox_fraction: 0.75
      minimum_valid_pixels: 20
      minimum_m: 0.05
      maximum_m: 5.0
    association:
      mahalanobis_threshold: 11.345
      duplicate_merge_enabled: true
      duplicate_merge_interval_frames: 25
    filter:
      confirmation_hits: 3
      confirmation_window_sec: 3.0
      stale_after_sec: 300.0
    class:
      confirmation_probability: 0.70
      conditional_reliability_floor: 0.60
      max_explicit_classes: 4
      evidence_decay: 0.95
    uncertainty:
      pixel_stddev_px: 2.0
      bbox_diagonal_fraction: 0.10
      extrinsic_stddev_m: 0.005
      world_stddev_m: 0.005
      process_noise_stddev_m: 0.002
    registry:
      path: semantic_objects.json
      legacy_coordinates_path: semantic_distances_dynamic.json
      write_legacy_coordinates: false
      persistence_interval_sec: 1.0
    search:
      default_timeout_sec: 30.0
    debug:
      publish_annotated: false
      annotated_topic: /semantic/debug/yolo
    diagnostics:
      publish: true
    export:
      voxel_size_m: 0.05
      voxel_size_deg: 5.0
      # Sparse object seeds are sufficient for 3DGS and keep capture responsive.
      object_point_voxel_size_m: 0.02
      object_max_seed_points: 1200
      maximum_sample_range_m: 3.0
      scene:
        enabled: false
        keyframe_translation_m: 0.10
        keyframe_rotation_deg: 8.0
        max_frames: 600
        max_background_points: 1500
        mask_padding_fraction: 0.02
